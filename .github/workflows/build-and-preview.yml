name: Build Resume & Update Preview

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6:00 AM UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Force rebuild even if sources unchanged'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  build-and-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Check for source changes
        id: check
        run: |
          FORCE="${{ inputs.force || 'false' }}"
          if [[ "$FORCE" == "true" ]]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            echo "Forced rebuild."
            exit 0
          fi

          # build-resume.sh owns the source hash and the PDF inventory, so this
          # caller cannot drift from the local build.
          chmod +x build-resume.sh
          if ./build-resume.sh --check; then
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected, skipping rebuild."
          else
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.rebuild == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended \
            imagemagick ghostscript

      - name: Build LaTeX to PDFs
        if: steps.check.outputs.rebuild == 'true'
        run: ./build-resume.sh

      - name: Generate preview image
        if: steps.check.outputs.rebuild == 'true'
        run: |
          chmod +x update-resume-preview.sh
          ./update-resume-preview.sh

      - name: Upload PDF to Google Drive
        if: steps.check.outputs.rebuild == 'true'
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
        run: |
          if [[ -z "$RCLONE_CONFIG" ]]; then
            echo "RCLONE_CONFIG secret not set — skipping Google Drive upload."
            exit 0
          fi
          sudo apt-get install -y -qq rclone

          CONFIG_FILE="$HOME/.config/rclone/rclone.conf"
          mkdir -p "$(dirname "$CONFIG_FILE")"
          # Python handles multiline secrets and escape sequences reliably
          python3 -c "
          import os
          config = os.environ['RCLONE_CONFIG']
          with open(os.path.expanduser('~/.config/rclone/rclone.conf'), 'w') as f:
              f.write(config)
          "
          echo "Config written to $CONFIG_FILE ($(wc -c < "$CONFIG_FILE") bytes)"
          head -3 "$CONFIG_FILE"

          # Extract the remote name from the config (first line in brackets)
          REMOTE=$(grep -m1 '^\[' "$CONFIG_FILE" | tr -d '[]')
          if [[ -z "$REMOTE" ]]; then
            echo "Error: Could not find remote name in RCLONE_CONFIG" >&2
            echo "Config first 5 lines:" >&2
            head -5 "$CONFIG_FILE" >&2
            exit 1
          fi
          echo "Using remote: $REMOTE"

          # Upload to parent folder — rclone replaces existing file by name, preserving file ID
          # File ID: 191t9WDPxvc-tl4gKenMbwUbahvO4RymU (Resume_Eusuf_Kanchwala_Backend_Java_Go.pdf)
          cp resume.pdf "Resume_Eusuf_Kanchwala_Backend_Java_Go.pdf"
          rclone copy "Resume_Eusuf_Kanchwala_Backend_Java_Go.pdf" "${REMOTE}:/" \
            --config "$CONFIG_FILE" \
            --drive-root-folder-id 1196dOMXtqi022tHjQIhle17Wj0rPfq74
          echo "PDF uploaded to Google Drive (replaced existing file)"

      - name: Commit changes
        if: steps.check.outputs.rebuild == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # .latex-source-hash is written by build-resume.sh
          git add resume.pdf resume-1page.pdf .latex-source-hash assets/resume-preview.jpg

          if git diff --staged --quiet; then
            echo "No content changes to commit (binary outputs identical)."
          else
            git commit -m "Update resume PDF and preview [daily build]"
            git push
          fi
