name: Build Resume & Update Preview

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6:00 AM UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Force rebuild even if sources unchanged'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  build-and-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Check for source changes
        id: check
        run: |
          # Compute hash of all LaTeX source files
          HASH=$(find latex/ -type f \( -name '*.tex' -o -name '*.sty' -o -name '*.cls' -o -name '*.bib' \) \
              -print0 2>/dev/null | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

          # Compare with stored hash
          STORED_HASH=""
          if [[ -f .latex-source-hash ]]; then
            STORED_HASH=$(cat .latex-source-hash)
          fi

          FORCE="${{ inputs.force || 'false' }}"
          if [[ "$FORCE" == "true" ]] || [[ "$HASH" != "$STORED_HASH" ]] || [[ ! -f resume.pdf ]]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            echo "Change detected (force=$FORCE, hash_changed=$([[ "$HASH" != "$STORED_HASH" ]] && echo yes || echo no), pdf_exists=$([[ -f resume.pdf ]] && echo yes || echo no))"
          else
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected — skipping rebuild."
          fi

      - name: Install dependencies
        if: steps.check.outputs.rebuild == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended \
            imagemagick ghostscript

      - name: Build LaTeX → PDF
        if: steps.check.outputs.rebuild == 'true'
        run: |
          cd latex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          mv main.pdf ../resume.pdf

      - name: Generate preview image
        if: steps.check.outputs.rebuild == 'true'
        run: |
          chmod +x update-resume-preview.sh
          ./update-resume-preview.sh

      - name: Upload PDF to Google Drive
        if: steps.check.outputs.rebuild == 'true'
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
        run: |
          if [[ -z "$RCLONE_CONFIG" ]]; then
            echo "RCLONE_CONFIG secret not set — skipping Google Drive upload."
            exit 0
          fi

          FILE_ID="191t9WDPxvc-tl4gKenMbwUbahvO4RymU"

          # Extract refresh token from rclone config
          REFRESH_TOKEN=$(echo "$RCLONE_CONFIG" | grep -o '"refresh_token":"[^"]*"' | cut -d'"' -f4)
          if [[ -z "$REFRESH_TOKEN" ]]; then
            echo "Error: Could not extract refresh_token from RCLONE_CONFIG" >&2
            exit 1
          fi

          # Get fresh access token using rclone's default OAuth credentials
          ACCESS_TOKEN=$(curl -s -X POST https://oauth2.googleapis.com/token \
            -d "client_id=202264815644.apps.googleusercontent.com" \
            -d "client_secret=X4Z3ca8xfWDb1Voo-_98OzY" \
            -d "refresh_token=$REFRESH_TOKEN" \
            -d "grant_type=refresh_token" | python3 -c "import json,sys; print(json.load(sys.stdin)['access_token'])")

          # Replace file content via Drive API (preserves file ID and share link)
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X PATCH "https://www.googleapis.com/upload/drive/v3/files/${FILE_ID}?uploadType=media" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/pdf" \
            --data-binary @resume.pdf)

          if [[ "$HTTP_CODE" == "200" ]]; then
            echo "PDF uploaded to Google Drive (file ID: ${FILE_ID})"
          else
            echo "Error: Google Drive upload failed (HTTP ${HTTP_CODE})" >&2
            exit 1
          fi

      - name: Save source hash
        if: steps.check.outputs.rebuild == 'true'
        run: |
          echo "${{ steps.check.outputs.hash }}" > .latex-source-hash

      - name: Commit changes
        if: steps.check.outputs.rebuild == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add resume.pdf .latex-source-hash assets/resume-preview.jpg

          if git diff --staged --quiet; then
            echo "No content changes to commit (binary outputs identical)."
          else
            git commit -m "Update resume PDF and preview [daily build]"
            git push
          fi
